<html lang="en-GB" data-theme="surge">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rl-theme");
          if (t === "daybreak" || t === "surge") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <header class="site-header site-header--light">
      <div class="nav-inner">
        <a class="brand" href="index.html">
          <img src="assets/icons/favicon.svg" alt="">
          <span><strong>River<span class="brand-launch">Launch</span>.app</strong><small>River intelligence</small></span>

        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="product.html">Product</a>

            <span data-theme-label>Surge</span>
          </button>
        </nav>
      </div>

    <div class="analytics-consent" id="analytics-consent" hidden>
      <p>We use analytics to understand which pages and features are useful. You can use the site without analytics.</p>
      <div class="analytics-consent__actions">
        <button type="button" class="button button--dark" data-analytics-accept>Allow analytics</button>
        <button type="button" class="button button--ghost" data-analytics-decline>Not now</button>
      </div>
    </div>
    <script src="assets/theme.js"></script>
